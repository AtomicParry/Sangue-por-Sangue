  const s = snap.exists ? snap.data() : {};
  const card = isN ? {name: s.nome || "", foto: s.foto || "", owner: "mestre", wiz: s.wiz} : cache.cards.find(c => c.id === id) || {name: ""};
  s.nome ??= card.name; s.att ??= {}; s.bn ??= {}; s.hp ??= {}; s.cs ??= []; s.es ??= []; s.fad ??= 0; s.ppA ??= null; s.ps ??= []; s.arm ??= {}; s.nivel ??= 1; s.pod ??= s.poderes ? [{n: "Poderes", d: s.poderes}] : [];
  let foto = card.foto || "", sub = "Geral", t;
  let dirty = false;
  const flush = async () => { dirty = false; try {
      const o = calc(s), mx = Object.values(o.hm).reduce((a, b) => a + b, 0), cur0 = PARTS.reduce((a, [k]) => a + Math.min(s.hp[k] ?? o.hm[k], o.hm[k]), 0), cur = Math.max(0, Math.min(mx, s.vit ?? cur0));
      if (isN) { const o2 = JSON.parse(JSON.stringify({...s, foto, pv: cur, pvMax: mx})); delete o2.wiz; await db.doc("npcs/" + id).set(o2); }
      else { await db.doc("fichas/" + id).set(JSON.parse(JSON.stringify(s)));
        await db.doc("cards/" + id).set({name: s.nome || card.name || "Sem nome", foto, pv: cur, pvMax: mx, owner: card.owner || id.split("_")[0]}); }
      if ($("#st")) $("#st").textContent = "✔ salvo";
    } catch (e) { toast("Erro ao salvar: " + (e.code || e.message)); } };
  const save = () => { dirty = true; if ($("#st")) $("#st").textContent = "…"; clearTimeout(t); t = setTimeout(flush, 600); };
  const pct = (a, b, x) => (+s.att[a] || 0) + (+s.att[b] || 0) + (+x || 0);
  const tile = (n, a, b, path, inp = true) => `<div class="sk"><b>${n}</b><small>${a} + ${b}</small><div class="pc"><button data-roll="${esc(n)}">🎲</button><span data-p="${path}" data-a="${a}" data-b="${b}"></span></div>${inp ? `<span class="m">bônus</span> <input type="number" data-i="${path}" value="${get(s, path) ?? 0}">` : ""}</div>`;
  const sel = (v, path) => `<select data-i="${path}">${ATTRS.map(a => `<option ${a[0] == v ? "selected" : ""}>${a[0]}</option>`).join("")}</select>`;
  const editor = (k, ph) => `<div class="skg">${s[k].map((x, i) => `<div class="sk"><input class="nm" data-i="${k}.${i}.n" value="${esc(x.n)}" placeholder="${ph}"><div class="ab">${sel(x.a, k + "." + i + ".a")}${sel(x.b, k + "." + i + ".b")}</div><div class="pc"><button data-roll="${esc(x.n)}">🎲</button><span data-p="${k}.${i}.x" data-a="${x.a}" data-b="${x.b}"></span></div><span class="m">bônus</span> <input type="number" data-i="${k}.${i}.x" value="${x.x || 0}"> <button class="g" data-del="${k}.${i}">✕</button></div>`).join("")}</div><div class="row"><button class="g" data-add="${k}">+ Adicionar</button></div>`;
  const prof = [["genero", "Gênero"], ["idade", "Idade"], ["terra", "Terra natal"], ["cultura", "Cultura"], ["altura", "Altura"], ["peso", "Peso"], ["classe", "Classe social"], ["prof", "Profissão"]];
  const pages = {
    Geral: () => `<div class="pn"><h3>Atributos</h3>
      <div class="attrs">${ATTRS.map(([k, n, c]) => `<div class="at" style="--c:${c}"><em>${k}</em><input type="number" data-i="att.${k}" value="${s.att[k] ?? 10}"><small>${n}</small></div>`).join("")}</div></div>
      <div class="pn"><h3>Derivados</h3><div class="der"><div>Pts. de Ação<b data-o="pa"></b></div><div>Mod. de Dano<b data-o="dano"></b></div><div>Mod. de XP<b data-o="xp"></b></div><div>Taxa de Cura<b data-o="cura"></b></div><div>Iniciativa<b data-o="ini"></b></div><div>Pts. de Sorte<b data-o="sorte"></b></div><div>Pts. de Poder<b data-o="pp"></b></div><div>Andar<input type="number" data-i="mv.andar" value="${s.mv?.andar ?? 6}"></div><div>Correr<input type="number" data-i="mv.correr" value="${s.mv?.correr ?? 18}"></div><div>Disparar<input type="number" data-i="mv.disparar" value="${s.mv?.disparar ?? 30}"></div></div></div>`,
    "Perícias": () => `<div class="pn"><h3>Perícias básicas</h3><div class="skg">${BASIC.map(([n, a, b]) => tile(n, a, b, "bn." + n)).join("")}</div></div><div class="pn"><h3>Perícias profissionais / outras</h3>${editor("cs", "Nome da perícia")}</div><div class="pn"><h3>Paixões</h3>${editor("ps", "Paixão")}</div>`,
    Combate: () => `<div class="pn"><h3>Estilos de combate</h3>${editor("es", "Nome do estilo")}</div>
      <div class="pn"><h3>Vitalidade</h3><div class="vit"><button class="g" data-vd="-5">−5</button><button class="g" data-vd="-1">−1</button><input type="number" data-i="vit"><span class="m">/ <b data-o="vitMax"></b></span><button class="g" data-vd="1">+1</button><button class="g" data-vd="5">+5</button></div><p class="m">Soma da vida de todas as partes do corpo. Reduza conforme o dano total.</p></div><div class="pn"><h3>Localização de acerto</h3><div class="body">${PARTS.map(([k, n]) => `${k == "cab" ? "<span></span>" : ""}<div class="bp" data-bp="${k}">${n}<br><input type="number" data-i="hp.${k}"> / <span data-o="hm.${k}"></span><div class="ar">🛡 Armadura <input type="number" data-i="arm.${k}" value="${s.arm[k] ?? 0}"></div></div>${k == "cab" ? "<span></span>" : ""}`).join("")}</div>
      <p class="m">Vida por parte do corpo calculada por CON + TAM.</p><button class="g" id="rl">🎲 Rolar local de acerto</button></div>
      <div class="pn"><h3>Resistências</h3><div class="skg">${RESIST.map(n => { const b = BASIC.find(x => x[0] == n); return tile(n, b[1], b[2], "bn." + n, false); }).join("")}</div></div>
      <div class="pn"><h3>Condições e ferimentos</h3><textarea data-i="cond">${esc(s.cond)}</textarea></div>`,
    Notas: () => `<div class="pn"><h3>Poderes / Habilidades</h3>${s.pod.map((x, i) => `<div class="pw"><div class="row"><input class="nm" data-i="pod.${i}.n" value="${esc(x.n)}" placeholder="Nome do poder" style="flex:1"><button class="g" data-del="pod.${i}">✕</button></div><textarea data-i="pod.${i}.d" placeholder="Descrição">${esc(x.d)}</textarea></div>`).join("")}<button class="g" data-add="pod">+ Novo poder</button></div><div class="pn"><h3>Inventário</h3><textarea data-i="inv">${esc(s.inv)}</textarea></div><div class="pn"><h3>Anotações</h3><textarea data-i="notas">${esc(s.notas)}</textarea></div>`
  };
  const paint = () => { const o = calc(s);
    document.querySelectorAll("[data-p]").forEach(e => e.textContent = pct(e.dataset.a, e.dataset.b, get(s, e.dataset.p)) + "%");
    document.querySelectorAll("[data-o]").forEach(e => { const k = e.dataset.o; e.textContent = k.startsWith("att.") ? s.att[k.slice(4)] ?? 10 : k.startsWith("hm.") ? o.hm[k.slice(3)] : o[k] ?? ""; });
    document.querySelectorAll("[data-bp]").forEach(e => { const k = e.dataset.bp, i = e.querySelector("input"), m = o.hm[k]; if (document.activeElement !== i) i.value = s.hp[k] ?? m; const v = +(s.hp[k] ?? m); e.className = "bp " + (v <= 0 ? "d" : v < m ? "w" : ""); });
    const vi = document.querySelector('[data-i="vit"]'); if (vi && document.activeElement !== vi) vi.value = s.vit ?? PARTS.reduce((a, [k]) => a + Math.min(s.hp[k] ?? o.hm[k], o.hm[k]), 0);
    const f = $("#fad"); if (f) f.value = s.fad;
  };
  const draw = () => {
    if (!s.criada && (isN ? isAdmin : (card.owner || id.split("_")[0]) === me.uid) && (card.wiz || newSheet.has(id))) return wizard();
    s.att = Object.fromEntries(ATTRS.map(([k]) => [k, s.att[k] ?? 10]));
    const o = calc(s);
    $("#main").innerHTML = `<button class="g" id="bk">← Voltar</button> <span id="st" class="m"></span> <button class="g" id="del" style="float:right">🗑 Excluir ficha</button>
    <div class="top"><div class="ph" id="ph" style="background-image:url('${foto}')" title="Clique para trocar a foto (PNG sem fundo se mistura melhor na sessão)"></div>
    <div class="pn" style="margin:0"><input data-i="nome" value="${esc(s.nome)}" style="font-size:22px;font-weight:700;width:100%;background:none;border:0"><div class="prof">${prof.map(([k, n]) => `<div><label>${n}</label><input data-i="${k}" value="${esc(s[k])}"></div>`).join("")}</div>
    <div class="row"><label class="m">NÍVEL DE FADIGA</label><select id="fad" data-i="fad">${FADIGA.map((f, i) => `<option value="${i}">${f}</option>`).join("")}</select></div></div>
    <div class="side"><div class="st" style="color:#fff"><input type="number" data-i="nivel" value="${s.nivel ?? 1}"><small>Nível</small></div><div class="st" style="color:#ff4a55"><input type="number" data-i="ppA" value="${s.ppA ?? o.pp}">/<span data-o="pp"></span><small>Pts. Poder</small></div><div class="st" style="color:#ff8a92"><input type="number" data-i="luA" value="${s.luA ?? o.luc}">/<span data-o="luc"></span><small>Lucidez</small></div><div class="st" style="color:#ddd"><input type="number" data-i="soA" value="${s.soA ?? o.sorte}">/<span data-o="sorte"></span><small>Sorte</small></div><div class="st" style="color:#fff"><input type="number" data-i="paA" value="${s.paA ?? o.pa}">/<span data-o="pa"></span><small>Pts. Ação</small></div></div></div>
    <input type="file" id="fi" accept="image/*" hidden>
    <div class="sub">${Object.keys(pages).map(p => `<button class="${p == sub ? "on" : ""}" data-s="${p}">${p}</button>`).join("")}</div><div id="pg">${pages[sub]()}</div>`;
    bind(); paint(); document.querySelectorAll("textarea").forEach(grow); };
  const bind = () => {
    $("#bk").onclick = async () => { clearTimeout(t); if (dirty) await flush(); openId = null; openNpc = null; render(); };
    $("#del").onclick = delSheet;
    document.querySelectorAll("[data-vd]").forEach(b => b.onclick = () => { const o = calc(s), cur = s.vit ?? PARTS.reduce((a, [k]) => a + Math.min(s.hp[k] ?? o.hm[k], o.hm[k]), 0); s.vit = Math.max(0, Math.min(o.vitMax, cur + +b.dataset.vd)); document.querySelector('[data-i="vit"]').value = s.vit; save(); });
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sub = b.dataset.s; draw(); });
    $("#ph").onclick = () => $("#fi").click();
    $("#fi").onchange = async e => { foto = await img(e.target.files[0], 512, .85, true); $("#ph").style.backgroundImage = `url('${foto}')`; save(); };
    document.querySelectorAll("[data-i]").forEach(e => e.oninput = () => { let v = e.type == "number" ? (e.value === "" ? null : +e.value) : e.value; if (e.dataset.i == "fad") v = +v; setp(s, e.dataset.i, v);
      if (e.dataset.i.match(/^(cs|es|ps)\.\d+\.[ab]$/)) e.closest(".sk").querySelector("[data-p]").dataset[e.dataset.i.slice(-1)] = v;
      if (e.tagName == "TEXTAREA") grow(e);
      paint(); save(); });
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { s[b.dataset.add].push(b.dataset.add == "pod" ? {n: "", d: ""} : {n: "", a: b.dataset.add == "ps" ? "POD" : "FOR", b: b.dataset.add == "ps" ? "CAR" : "DES", x: 0}); draw(); save(); });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const [k, i] = b.dataset.del.split("."); s[k].splice(i, 1); draw(); save(); });
    const rollTile = el => { const v = parseInt(el.querySelector("[data-p]").textContent) || 0, title = el.querySelector(".nm")?.value || el.querySelector("b")?.textContent || "Perícia"; openDice(); pushRoll({kind: "skill", title, v, r: 1 + Math.floor(Math.random() * 100), who: s.nome || "?"}); };
    document.querySelectorAll(".sk").forEach(el => { el.style.cursor = "pointer"; el.onclick = ev => { if (!ev.target.closest("input,select,[data-del]")) rollTile(el); }; });
    const pre = $("#pre"); if (pre) pre.onchange = () => { const v = PRESETS[pre.value]; if (!v) return; ATTRS.forEach(([k], i) => s.att[k] = v[i]); draw(); save(); };
    const rl = $("#rl"); if (rl) rl.onclick = () => { const r = 1 + Math.floor(Math.random() * 20), p = r <= 3 ? "Perna Dir." : r <= 6 ? "Perna Esq." : r <= 9 ? "Abdômen" : r <= 12 ? "Peito" : r <= 15 ? "Braço Dir." : r <= 18 ? "Braço Esq." : "Cabeça"; openDice(); pushRoll({kind: "dice", title: "Local: " + p, rolls: [r], mod: 0, total: r, who: s.nome || "?"}); };
  };

  const delSheet = async () => { if (!confirm("Excluir esta ficha? Não dá para desfazer.")) return; clearTimeout(t); try { localStorage.removeItem(wk); } catch (e) {}
    if (isN) await db.doc("npcs/" + id).delete(); else { await db.doc("fichas/" + id).delete(); await db.doc("cards/" + id).delete(); } openId = null; openNpc = null; render(); };
  const wk = "wiz_" + me.uid + "_" + id, persist = () => { try { localStorage.setItem(wk, JSON.stringify(W)); } catch (e) {} };
  const loadW = () => { try { return JSON.parse(localStorage.getItem(wk)); } catch (e) { return null; } };
  let W = null;
  const wizard = () => {
    W ??= loadW() ?? {step: 0, att: {}, pro: [], spec: {}, cp: {}, p2: {}, pass: ["", "", ""], genero: "Masculino", classe: "", nome: s.nome || "", free: false, pk: "", profn: "", ppro: [], p1: {}};
    const cc = () => CULT[W.cult], pool = () => W.free ? null : PRESETS[W.pk], sum = o => Object.values(o).reduce((a, b) => a + (+b || 0), 0);
    const skc = () => { const c = cc(); return c ? [...W.pro.map(n => { const p = c.pro.find(x => x[0] == n); return {k: n, n: p[3] ? `${n} (${W.spec[n] || "?"})` : n, a: p[1], b: p[2]}; }), ...c.rest.map(n => { const b = BASIC.find(x => x[0] == n); return {k: n, n, a: b[1], b: b[2]}; })] : []; };
    const nd = () => 7 - PROF[W.profn].b.length;
    const psk = () => { const P = PROF[W.profn]; if (!P) return []; const seen = {}, l = []; [...P.b, ...W.ppro].forEach(n => { const d = def(n); if (!seen[d.k]) { seen[d.k] = 1; l.push(d); } }); if (W.estilo?.trim()) l.push({k: "__e", n: W.estilo.trim() + " (estilo)", a: "FOR", b: "DES"}); return l; };
    const sk = () => { const l = skc(); psk().forEach(x => { if (!l.some(y => y.k == x.k)) l.push(x); }); return l; };
    const s2 = () => sk().map(x => x.k).reduce((a, k) => a + (+W.p2[k] || 0), 0);
    const s1 = () => psk().reduce((a, x) => a + (+W.p1[x.k] || 0), 0);
    const remP = () => { const r = [...pool()]; Object.values(W.att).filter(v => v).map(Number).forEach(v => { const i = r.indexOf(v); i >= 0 ? r.splice(i, 1) : r.push("!"); }); return r; };
    const check = () => { const st = W.step, a = W.att;
      if (st == 0) return W.nome && W.idade && W.classe ? "" : "Preencha nome, idade e classe social.";
      if (st == 1) return W.free ? (sum(a) == 80 && ATTRS.every(([k]) => a[k] >= 3 && a[k] <= 18) && a.INT >= 8 && a.TAM >= 8 ? "" : "Some exatamente 80 pontos (3 a 18 cada; INT e TAM mín. 8).") : (pool() && ATTRS.every(([k]) => a[k]) && !remP().length ? "" : "Distribua todos os valores do pacote.");
      if (st == 2) return !W.cult ? "Escolha a cultura." : W.pro.length < 3 ? "Marque 3 perícias profissionais." : cc().pro.some(p => p[3] && W.pro.includes(p[0]) && !(W.spec[p[0]] || "").trim()) ? "Diga qual Conhecimento/Idioma." : skc().some(x => (W.cp[x.k] || 0) > 15) ? "Máximo 15 por perícia." : sum(W.cp) != 100 ? "Distribua exatamente 100 pontos." : "";
      if (st == 3) return !W.profn ? "Escolha a profissão." : W.ppro.length != nd() ? `Marque ${nd()} perícias profissionais.` : !W.estilo?.trim() ? "Escolha ou escreva o estilo de combate." : s1() != 100 ? "Distribua exatamente 100 pontos." : "";
      if (st == 4) return s2() == 200 ? "" : "Distribua exatamente 200 pontos.";
      return W.pass.every(x => x.trim()) ? "" : "Escreva as 3 paixões."; };
    const show = () => { const st = W.step; let h = "";
      const p1html = () => psk().map(x => `<div><label>${esc(x.n)} (${x.a}+${x.b})</label><input type="number" min="0" data-p1="${x.k}" value="${W.p1[x.k] ?? 0}"></div>`).join("");
      if (st == 0) h = `<div class="wg"><div><label>Nome</label><input data-w="nome" value="${esc(W.nome)}"></div><div><label>Idade</label><input type="number" data-w="idade" value="${W.idade ?? ""}"></div><div><label>Gênero</label><select data-w="genero">${["Masculino", "Feminino", "Outro"].map(g => `<option ${g == W.genero ? "selected" : ""}>${g}</option>`).join("")}</select></div><div><label>Peso (kg)</label><input data-w="peso" value="${esc(W.peso)}" placeholder="Ex: 75kg"></div><div style="grid-column:1/-1"><label>Terra natal</label><input data-w="terra" value="${esc(W.terra)}" placeholder="Ex: Gemini City, Japão..."></div></div><h3>Classe social</h3><div class="row">${CLS.map(x => `<button class="chip ${x == W.classe ? "on" : ""}" data-cl="${x}">${x}</button>`).join("")}</div>`;
      if (st == 1) h = `<label class="row"><input type="checkbox" id="fl" ${W.free ? "checked" : ""}> Distribuição livre (80 pontos; mín. 8 INT e TAM)</label>${W.free ? "" : `<div class="row"><b>Pacote base</b><select id="pk"><option value="">-- Escolha --</option>${Object.entries(PRESETS).map(([k, v]) => `<option value="${k}" ${k == W.pk ? "selected" : ""}>${k} (${v.join(", ")})</option>`).join("")}</select><button class="g" id="rnd">🎲 Aleatório</button></div>`}<p id="rem"></p><div class="wg">${ATTRS.map(([k, n]) => `<div><label>${n} (${k})</label>${W.free ? `<input type="number" min="3" max="18" data-wa="${k}" value="${W.att[k] ?? ""}">` : `<select data-wa="${k}"><option value="">—</option>${[...new Set(pool() || [])].map(v => `<option ${W.att[k] == v ? "selected" : ""}>${v}</option>`).join("")}</select>`}</div>`).join("")}</div>`;
      if (st == 2) { const c = cc(); h = `<div class="row">${Object.keys(CULT).map(x => `<button class="chip ${x == W.cult ? "on" : ""}" data-cu="${x}">${x}</button>`).join("")}</div>` + (c ? `<h3>Perícias profissionais (marque 3)</h3><div class="wg">${c.pro.map(p => `<div><label><input type="checkbox" data-pr="${p[0]}" ${W.pro.includes(p[0]) ? "checked" : ""} ${!W.pro.includes(p[0]) && W.pro.length >= 3 ? "disabled" : ""}> ${p[0]}</label>${p[3] && W.pro.includes(p[0]) ? `<input data-sp="${p[0]}" value="${esc(W.spec[p[0]])}" placeholder="Qual?">` : ""}</div>`).join("")}</div>` + (W.pro.length == 3 ? `<h3>Distribua 100 pontos (0 a 15 cada)</h3><div class="row"><button class="g" data-rnd="cp">🎲 Aleatório</button></div><p id="rem"></p><div class="wg">${skc().map(x => `<div><label>${esc(x.n)} (${x.a}+${x.b})</label><input type="number" min="0" max="15" data-cp="${x.k}" value="${W.cp[x.k] ?? 0}"></div>`).join("")}</div>` : "") : ""); }
      if (st == 3) { const P = PROF[W.profn];
        h = `<div class="row"><b>Profissão</b><select data-prf><option value="">-- Escolha --</option>${Object.keys(PROF).map(k => `<option ${k == W.profn ? "selected" : ""}>${k}</option>`).join("")}</select></div>` + (P ? `<p class="hint">Perícias básicas da profissão: ${P.b.join(", ")}. Total: ${P.b.length} básicas + ${nd()} profissionais = 7 perícias.</p><div class="sec"><h3>Perícias profissionais (marque ${nd()})</h3><div class="wg">${P.p.map(n => `<div><label><input type="checkbox" data-ppr="${n}" ${W.ppro.includes(n) ? "checked" : ""} ${!W.ppro.includes(n) && W.ppro.length >= nd() ? "disabled" : ""}> ${n}</label></div>`).join("")}</div></div><div class="sec"><h3>Estilo de combate (FOR+DES)</h3><input data-w="estilo" list="dl-est" value="${esc(W.estilo)}" placeholder="${P.e.length ? P.e.join(", ") : "Conforme o treinamento do personagem"}"><datalist id="dl-est">${P.e.map(e => `<option>${e}</option>`).join("")}</datalist></div>` + (W.ppro.length == nd() ? `<div class="sec"><h3>Distribua 100 pontos</h3><div class="row"><button class="g" data-rnd="p1">🎲 Aleatório</button></div><p class="hint" id="rem"></p><div class="wg" id="pl3">${p1html()}</div></div>` : "") : ""); }
      if (st == 4) h = `<h3>Distribua 200 pontos entre as perícias do seu caminho</h3><div class="row"><button class="g" data-rnd="p2">🎲 Aleatório</button></div><p id="rem"></p><div class="wg">${sk().map(x => `<div><label>${esc(x.n)} <span data-pp="${x.k}"></span></label><input type="number" min="0" data-p2="${x.k}" value="${W.p2[x.k] ?? 0}"></div>`).join("")}</div>`;
      if (st == 5) h = `<p class="m">Cada paixão vira uma perícia (POD+CAR) com bônus.</p>${[40, 30, 20].map((b, i) => `<div class="row"><b>+${b}</b><input data-ps="${i}" value="${esc(W.pass[i])}" placeholder="Ex: Lealdade à família" style="flex:1"></div>`).join("")}`;
      $("#main").innerHTML = `<div class="wz"><h2>Criar personagem</h2><div class="steps">${["Dados", "Características", "Cultura", "Profissão", "Perícias", "Paixões"].map((n, i) => `<span class="${i == st ? "on" : i < st ? "ok" : ""}"><i>${i + 1}</i>${n}</span>`).join("")}</div><div class="pn">${h}</div><div class="err" id="wm"></div><div class="row"><button class="g" id="wb" ${st ? "" : "disabled"}>← Voltar</button><button id="wn">${st == 5 ? "Concluir" : "Avançar →"}</button><span style="flex:1"></span><button class="g" id="wx">Sair</button><button class="g" id="wd">🗑 Excluir ficha</button></div></div>`;
      const upd = () => { const r = $("#rem"); if (!r) return;
        if (st == 1) r.innerHTML = W.free ? `Restante: <b>${80 - sum(W.att)}</b>` : pool() ? `Valores restantes: <b>${remP().join(", ") || "Distribuídos!"}</b>` : "Escolha um pacote.";
        if (st == 2) r.innerHTML = `Restante: <b>${100 - sum(W.cp)}</b>`;
        if (st == 3) r.innerHTML = `Pontos restantes: <b>${100 - s1()}</b>`;
        if (st == 4) { r.innerHTML = `Restante: <b>${200 - s2()}</b>`; document.querySelectorAll("[data-pp]").forEach(e => { const x = sk().find(y => y.k == e.dataset.pp); e.textContent = ((+W.att[x.a] || 0) + (+W.att[x.b] || 0) + (W.p2[x.k] || 0) + (W.cp[x.k] || 0) + (W.p1[x.k] || 0)) + "%"; }); } };
      const on = (q, f) => document.querySelectorAll(q).forEach(f);
      on("[data-w]", e => e.oninput = () => { W[e.dataset.w] = e.value; if (e.dataset.w == "estilo" && $("#pl3")) { $("#pl3").innerHTML = p1html(); document.querySelectorAll("#pl3 [data-p1]").forEach(i => i.oninput = () => { W.p1[i.dataset.p1] = +i.value; upd(); }); upd(); } });
      on("[data-cl]", b => b.onclick = () => { W.classe = b.dataset.cl; show(); });
      on("[data-wa]", e => e.oninput = () => { W.att[e.dataset.wa] = e.value === "" ? "" : +e.value; upd(); });
      if ($("#fl")) $("#fl").onchange = e => { W.free = e.target.checked; W.att = {}; show(); };
      if ($("#pk")) $("#pk").onchange = e => { W.pk = e.target.value; W.att = {}; show(); };
      if ($("#rnd")) $("#rnd").onclick = () => { if (!pool()) return; const p = [...pool()].sort(() => Math.random() - .5); ATTRS.forEach(([k], i) => W.att[k] = p[i]); show(); };
      on("[data-cu]", b => b.onclick = () => { W.cult = b.dataset.cu; W.pro = []; W.spec = {}; W.cp = {}; W.p2 = {}; show(); });
      on("[data-pr]", e => e.onchange = () => { const n = e.dataset.pr; if (e.checked) W.pro.push(n); else { W.pro = W.pro.filter(x => x != n); delete W.cp[n]; delete W.p2[n]; } show(); });
      on("[data-sp]", e => e.oninput = () => { W.spec[e.dataset.sp] = e.value; });
      on("[data-cp]", e => e.oninput = () => { W.cp[e.dataset.cp] = +e.value; upd(); });
      on("[data-p2]", e => e.oninput = () => { W.p2[e.dataset.p2] = +e.value; upd(); });
      on("[data-rnd]", b => b.onclick = () => { const k = b.dataset.rnd; if (k == "cp") W.cp = randPts(skc().map(x => x.k), 100); if (k == "p1") W.p1 = randPts(psk().map(x => x.k), 100); if (k == "p2") W.p2 = randPts(sk().map(x => x.k), 200); show(); });
      on("[data-prf]", e => e.onchange = () => { W.profn = e.value; W.ppro = []; W.p1 = {}; W.estilo = ""; show(); });
      on("[data-ppr]", e => e.onchange = () => { const n = e.dataset.ppr; if (e.checked) W.ppro.push(n); else { W.ppro = W.ppro.filter(x => x != n); delete W.p1[n]; } show(); });
      on("[data-p1]", e => e.oninput = () => { W.p1[e.dataset.p1] = +e.value; upd(); });
      on("[data-ps]", e => e.oninput = () => { W.pass[e.dataset.ps] = e.value; });
      $("#wb").onclick = () => { W.step--; show(); };
      $("#wx").onclick = async () => { const nm = (W.nome || "").trim(); if (nm) { try { await db.doc((isN ? "npcs/" : "cards/") + id).update(isN ? {nome: nm} : {name: nm}); } catch (e) {} } openId = null; openNpc = null; render(); }; $("#wd").onclick = delSheet;
      $("#wn").onclick = () => { const m = check(); if (m) return $("#wm").textContent = m; if (st < 5) { W.step++; show(); } else finish(); };
      $("#main").oninput = $("#main").onchange = persist;
      upd(); persist(); };
    const finish = () => {
      Object.assign(s, {nome: W.nome, idade: W.idade, genero: W.genero, peso: W.peso, terra: W.terra, classe: W.classe, cultura: W.cult, prof: W.profn});
      s.att = Object.fromEntries(Object.entries(W.att).map(([k, v]) => [k, +v])); s.altura = (1.4 + 0.03 * s.att.TAM).toFixed(2).replace(".", ",") + "m";
      s.bn = {}; s.cs = [];
      sk().filter(x => x.k != "__e").forEach(x => { const v = (W.cp[x.k] || 0) + (W.p1[x.k] || 0) + (W.p2[x.k] || 0); if (BASIC.some(b => b[0] == x.k)) s.bn[x.k] = v; else s.cs.push({n: x.n, a: x.a, b: x.b, x: v}); });
      s.es = [{n: W.estilo, a: "FOR", b: "DES", x: (W.p1.__e || 0) + (W.p2.__e || 0)}];
      s.ps = W.pass.map((n, i) => ({n, a: "POD", b: "CAR", x: [40, 30, 20][i]}));
      s.nivel = 1; s.hp = {}; s.criada = true; newSheet.delete(id); try { localStorage.removeItem(wk); } catch (e) {} W = null; draw(); flush(); };
    show(); };
  draw();
}

/* ---------- SESSÃO ---------- */
function sessaoView() {
  const ss = cache.session, ids = ss.ids || [], pos = ss.pos || {}, size = ss.size || 38, fx = ss.fx || {}, pl = cache.cards.filter(c => ids.includes(c.id));
  $("#main").innerHTML = `<div class="stage full" style="background-image:url('${ss.map || ""}')">${pl.map((c, i) => { const p = pos[c.id] || {x: (i + 1) / (pl.length + 1) * 100, y: 4};
    return `<div class="fig" data-id="${c.id}" style="left:${p.x}%;bottom:${p.y}%">${c.foto ? `<img src="${c.foto}" style="height:${size}vh" draggable="false">` : `<div class="nof" style="height:${size}vh">👤</div>`}<span>${esc(c.name)}</span></div>`; }).join("")}${!ss.map && !isAdmin ? '<p class="m" style="position:absolute;top:80px;left:24px">Aguardando o mestre escolher o cenário…</p>' : ""}${fx.night ? '<div class="ov night"></div>' : ""}${fx.cold ? '<div class="ov cold"></div>' : ""}${fx.fog ? '<div class="ov fog"></div>' : ""}${fx.alert ? '<div class="ov alert"></div>' : ""}${fx.rain || fx.storm || fx.snow || fx.embers ? `<canvas class="fxc" data-m="${[fx.rain || fx.storm ? "rain" : "", fx.storm ? "storm" : "", fx.snow ? "snow" : "", fx.embers ? "embers" : ""].filter(Boolean).join(",")}"></canvas>` : ""}</div>
  ${isAdmin ? `<div class="sctl"><button class="g" id="sct">⚙ Controles</button><div id="scb"><div class="row"><b>Cenário</b><input type="file" id="mp" accept="image/*"><button class="g" id="cm">Remover</button></div><div class="row"><b>Tamanho</b><input type="range" id="sz" min="15" max="80" value="${size}"></div><b>Efeitos</b><div class="fxg">${FXS.map(([k, n]) => `<button class="g ${fx[k] ? "on" : ""}" data-fx="${k}">${n}</button>`).join("")}</div><b>Sons</b><div class="fxg">${SFX.map(([k, n]) => `<button class="g" data-sfx="${k}">${n}</button>`).join("")}<button class="g" id="fxc">Limpar efeitos</button></div><b>Personagens na cena</b><div class="chk">${cache.cards.map(c => `<label><input type="checkbox" data-p="${c.id}" ${ids.includes(c.id) ? "checked" : ""}> ${esc(c.name)}</label>`).join("")}</div><button class="g" id="rp">Reposicionar</button><p class="m" style="margin:0;font-size:12px">Arraste os personagens na cena. PNG sem fundo se mistura ao cenário.</p></div></div>` : ""}`;
  const cv = $(".fxc"); if (cv) runFx(cv);
  if (!isAdmin) return;
  const S = (o) => db.doc("session/current").set(o, {merge: true});
  $("#sct").onclick = () => $("#scb").classList.toggle("off");
  document.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => S({fx: {[b.dataset.fx]: !fx[b.dataset.fx]}}));
  document.querySelectorAll("[data-sfx]").forEach(b => b.onclick = () => S({sfx: {n: b.dataset.sfx, id: Date.now()}}));
  $("#fxc").onclick = () => S({fx: Object.fromEntries(FXS.map(([k]) => [k, false]))});
  $("#mp").onchange = async e => S({map: await img(e.target.files[0], 2000, .85, false, 950000)});
  $("#cm").onclick = () => S({map: ""});
  $("#sz").oninput = e => document.querySelectorAll(".fig img,.fig .nof").forEach(i => i.style.height = e.target.value + "vh");
  $("#sz").onchange = e => S({size: +e.target.value});
  $("#rp").onclick = () => db.doc("session/current").update({pos: firebase.firestore.FieldValue.delete()}).catch(() => {});
  document.querySelectorAll("[data-p]").forEach(e => e.onchange = () => S({ids: [...document.querySelectorAll("[data-p]")].filter(x => x.checked).map(x => x.dataset.p)}));
  document.querySelectorAll(".fig").forEach(f => { f.style.cursor = "grab";
    f.onpointerdown = ev => { ev.preventDefault(); const st = $(".stage").getBoundingClientRect(), id = f.dataset.id, x0 = parseFloat(f.style.left), y0 = parseFloat(f.style.bottom), px = ev.clientX, py = ev.clientY; let nx = x0, ny = y0; f.setPointerCapture(ev.pointerId);
      f.onpointermove = e => { nx = Math.max(0, Math.min(100, x0 + (e.clientX - px) / st.width * 100)); ny = Math.max(-5, Math.min(90, y0 - (e.clientY - py) / st.height * 100)); f.style.left = nx + "%"; f.style.bottom = ny + "%"; };
      f.onpointerup = () => { f.onpointermove = f.onpointerup = null; S({pos: {[id]: {x: nx, y: ny}}}); }; }; });
}

/* ---------- EFEITOS ESPECIAIS ---------- */
function efeitosView() {
  const load = () => { try { return JSON.parse(localStorage.getItem("efp_" + me.uid) || "[]"); } catch (e) { return []; } };
  let P = load();
  const TG = {of: "Ofensivo", de: "Defensivo", cr: "Crítico / Fumble"};
  const grid = () => { const F = {todos: () => true, of: x => x.g.includes("of"), de: x => x.g.includes("de"), cr: x => x.g.includes("cr"), fx: x => P.includes(x.n)}[efF], q = efQ.toLowerCase();
    return EFX.filter(F).filter(x => !q || (x.t + " " + x.d + " " + x.r).toLowerCase().includes(q)).map(x => `<div class="efc ${P.includes(x.n) ? "pin" : ""}"><div class="efn"><span>${String(x.n).padStart(2, "0")}</span><button class="g efs" data-pin="${x.n}" title="Fixar">${P.includes(x.n) ? "★" : "☆"}</button></div><h4>${x.t}</h4><p>${x.d}</p>${x.r ? `<div class="eft"><b>Teste / Resistência</b><p>${x.r}</p></div>` : ""}<div class="row">${x.g.map(g => `<span class="etg ${g}">${TG[g]}</span>`).join("")}</div></div>`).join("") || '<p class="m">Nenhum efeito encontrado.</p>'; };
  const bindPins = () => document.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => { const n = +b.dataset.pin; P = P.includes(n) ? P.filter(x => x != n) : [...P, n]; try { localStorage.setItem("efp_" + me.uid, JSON.stringify(P)); } catch (e) {} efeitosView(); });
  $("#main").innerHTML = `<div class="pn efh"><div><h2>Efeitos Especiais</h2><p class="m" style="margin:4px 0 0">${EFX.length} efeitos · regras de combate ao alcance da mesa.</p></div><div class="row"><input id="efq" placeholder="Buscar efeito..." value="${esc(efQ)}">${[["todos", "Todos"], ["of", "Ofensivos"], ["de", "Defensivos"], ["cr", "Críticos"], ["fx", "Fixados " + P.length]].map(([k, n]) => `<button class="chip ${efF == k ? "on" : ""}" data-ef="${k}">${n}</button>`).join("")}</div></div><div class="efg" id="efg">${grid()}</div>`;
  document.querySelectorAll("[data-ef]").forEach(b => b.onclick = () => { efF = b.dataset.ef; efeitosView(); });
  $("#efq").oninput = e => { efQ = e.target.value; $("#efg").innerHTML = grid(); bindPins(); };
  bindPins();
}

/* ---------- NPCs (modo mestre) ---------- */
function npcsView() {
  if (openNpc) return sheetView(openNpc, "npcs");
  $("#main").innerHTML = `<h2>NPCs <span class="m">(privado)</span></h2><button id="nn">+ Novo NPC</button><div class="grid" style="margin-top:16px">${cache.npcs.map(n => `<div style="position:relative">${cardHTML({id: n.id, name: n.nome || "Sem nome", foto: n.foto, pv: n.pv ?? 0, pvMax: n.pvMax ?? n.pv ?? 0}, true)}<button class="g xdel" data-x="${n.id}" title="Excluir NPC">🗑</button></div>`).join("")}</div>`;
  $("#nn").onclick = async () => { const r = await db.collection("npcs").add({nome: "", foto: "", pv: 0, pvMax: 0, wiz: true}); newSheet.add(r.id); openNpc = r.id; render(); };
  document.querySelectorAll(".card.click").forEach(el => el.onclick = () => { openNpc = el.dataset.id; render(); });
  document.querySelectorAll("[data-x]").forEach(b => b.onclick = async () => { if (confirm("Excluir este NPC?")) await db.doc("npcs/" + b.dataset.x).delete(); });
}
</script>
