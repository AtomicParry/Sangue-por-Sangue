<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa Mythras</title>
<style>
:root{--bg:#000;--p:#141414;--p2:#262626;--r:#c0212b;--r2:#ff4a55;--t:#eee;--m:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--p2);border:1px solid #333;border-radius:8px;padding:6px 9px;min-width:0}
button{cursor:pointer;background:var(--r);border:0;font-weight:600}button.g{background:var(--p2);border:1px solid #333}
textarea{width:100%;min-height:110px}
.box{max-width:340px;margin:12vh auto;background:var(--p);padding:28px;border-radius:14px;border-top:3px solid var(--r);display:grid;gap:10px}
h2,h3{margin:0}nav{display:flex;gap:6px;padding:10px 16px;background:var(--p);border-bottom:2px solid var(--r);align-items:center;flex-wrap:wrap}
nav button{background:none;color:var(--m)}nav button.on{color:#fff;border-bottom:2px solid var(--r2);border-radius:0}nav .sp{flex:1}
nav #ms.on{background:var(--r);color:#fff;border-radius:8px}
main{padding:14px;max-width:1150px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--p);border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;text-align:center;border-bottom:3px solid var(--r)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--r2)}
.ph{height:170px;background:#000 center/cover}.card b{display:block;padding:6px}
.bar{height:8px;background:#400;margin:0 8px 6px;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--r2)}
.pn{background:var(--p);padding:14px;border-radius:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.top{display:grid;grid-template-columns:200px 1fr 110px;gap:10px}.top .ph{height:100%;min-height:200px;border-radius:14px;cursor:pointer}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prof label{font-size:10px;color:var(--m);text-transform:uppercase}.prof input{width:100%;background:none;border:0;border-bottom:1px solid #333;border-radius:0;padding:3px 0;font-size:15px}
.side{display:grid;gap:8px}.st{background:var(--p);border-radius:12px;padding:10px;text-align:center;font-size:20px;font-weight:700}
.st input{width:46px;text-align:center;background:none;border:0;font-size:20px;font-weight:700;color:inherit;padding:0}.st small{display:block;font-size:10px;color:var(--m);font-weight:400}
.attrs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.at{border-radius:14px;padding:8px;text-align:center;background:color-mix(in srgb,var(--c) 18%,#111);border:1px solid color-mix(in srgb,var(--c) 40%,#111)}
.at b{font-size:28px;color:var(--c)}.at input{width:46px;text-align:center}.at small{display:block;font-size:10px;color:var(--c);margin-top:4px}
.sub{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.sub button{background:var(--p2)}.sub button.on{background:var(--r)}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sk{background:var(--p2);border-radius:12px;padding:8px;text-align:center}.sk small{display:block;color:var(--m);font-size:10px}
.sk .pc{display:flex;gap:6px;align-items:center;justify-content:center;background:#4a4a4a;border-radius:20px;padding:3px 10px;margin:5px 0;font-weight:700}
.sk .pc button{background:none;padding:0;font-size:16px}.sk input{width:56px;text-align:center;padding:2px}
.der{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.der div{background:var(--p2);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--m)}.der b{display:block;font-size:20px;color:var(--t)}
.body{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:auto}
.bp{border-radius:10px;padding:8px;text-align:center;background:#1c2a12;color:#8f8;font-size:11px}.bp input{width:40px;text-align:center;font-size:18px;font-weight:700;background:none;border:0;color:inherit;padding:0}
.bp.w{background:#3a2c0e;color:#fb2}.bp.d{background:#3a1010;color:#f55}
.ed{display:grid;grid-template-columns:2fr 1fr 1fr 70px auto;gap:6px;margin:5px 0}
.stage{position:relative;aspect-ratio:16/9;background:#111 center/cover;border-radius:12px;overflow:hidden;border:2px solid var(--r)}
.stage .pl{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.stage .card{width:120px;background:#000b}.stage .ph{height:110px}
.err{color:var(--r2)}.m{color:var(--m)}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--r);padding:10px 18px;border-radius:10px;display:none;z-index:9;font-weight:700}
@media(max-width:760px){.top{grid-template-columns:1fr}.attrs{grid-template-columns:repeat(4,1fr)}.prof{grid-template-columns:repeat(2,1fr)}.ed{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCL_dAGRjrvs15I_iy3q-dvcKaMpTr6JP0",
  authDomain: "sangue-por-sangue.firebaseapp.com",
  projectId: "sangue-por-sangue",
  appId: "1:761376051892:web:a6d94949c3857bf65a3de1"
};
/* ===== REGRAS DO SISTEMA (Mythras) — ajuste aqui ===== */
const ATTRS = [["FOR","Força","#ff3b3b"],["CON","Constituição","#ff9f2e"],["TAM","Tamanho","#7ee8d0"],["DES","Destreza","#8fe34a"],["INT","Inteligência","#3aa0ff"],["POD","Poder","#b43cff"],["CAR","Carisma","#ff3c9a"]];
const PRESETS = {"Padrão":[14,13,12,11,11,10,9],"Balanceada":[12,12,12,12,11,11,10],"Especializada":[16,15,13,10,10,8,8]};
const BASIC = [["Atletismo","FOR","DES"],["Condução","DES","POD"],["Desarmado","FOR","DES"],["Dissimulação","INT","CAR"],["Estilo de Combate","FOR","DES"],["Evasão","DES","DES"],["Vontade","POD","POD"],["Furtividade","DES","INT"],["Influência","CAR","CAR"],["Intuição","INT","POD"],["Língua Nativa","INT","CAR"],["Malandragem","POD","CAR"],["Musculatura","FOR","TAM"],["Ocultação","DES","POD"],["Percepção","INT","POD"],["Tolerância","CON","CON"]];
const RESIST = ["Evasão","Vontade","Musculatura","Tolerância"];
const FADIGA = ["Descansado","Ofegante","Cansado","Esgotado","Exausto","Debilitado","Incapacitado","Morto"];
const PARTS = [["cab","Cabeça",[1,2,3,4,5,6,7,8]],["be","Braço Esq.",[1,1,2,3,4,5,6,7]],["pei","Peito",[3,4,5,6,7,8,9,10]],["bd","Braço Dir.",[1,1,2,3,4,5,6,7]],["pe","Perna Esq.",[1,2,3,4,5,6,7,8]],["abd","Abdômen",[2,3,4,5,6,7,8,9]],["pd","Perna Dir.",[1,2,3,4,5,6,7,8]]];
const hpMax = (p, sum) => { const c = Math.max(0, Math.floor((sum - 1) / 5)); return c > 7 ? p[7] + c - 7 : p[c]; };
const dano = x => x <= 5 ? "-1d8" : x <= 10 ? "-1d6" : x <= 15 ? "-1d4" : x <= 20 ? "-1d2" : x <= 25 ? "0" : x <= 30 ? "+1d2" : x <= 35 ? "+1d4" : x <= 40 ? "+1d6" : "+1d8";
const calc = s => { const a = k => +s.att[k] || 0, hm = {};
  PARTS.forEach(([k,, t]) => hm[k] = hpMax(t, a("CON") + a("TAM")));
  return {hm, pa: Math.ceil((a("INT") + a("DES")) / 12), pp: a("POD"), sorte: Math.max(1, Math.ceil(a("POD") / 6)), cura: Math.max(1, Math.ceil(a("CON") / 6)),
    dano: dano(a("FOR") + a("TAM")), xp: a("CAR") <= 6 ? -1 : Math.floor((a("CAR") - 1) / 6) - 1, ini: Math.ceil((a("INT") + a("DES")) / 2)}; };
/* ===================================================== */
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore(), DOM = "@mesa.local";
const $ = q => document.querySelector(q), app = $("#app");
let me = null, isAdmin = false, tab = "fichas", subs = [], npcSub = null, cache = {cards: [], session: {}, npcs: []}, openId = null;
const slug = n => n.toLowerCase().trim().replace(/[^a-z0-9]+/g, "_");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const get = (o, p) => p.split(".").reduce((x, k) => x?.[k], o);
const setp = (o, p, v) => { const ks = p.split("."), l = ks.pop(); ks.reduce((x, k) => x[k] ??= {}, o)[l] = v; };
const toast = t => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 5000); };
const img = (f, max, q) => new Promise(r => { const i = new Image(); i.onload = () => { const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = i.width * k; c.height = i.height * k; c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); r(c.toDataURL("image/jpeg", q)); }; i.src = URL.createObjectURL(f); });
const d100 = (n, p) => { const r = 1 + Math.floor(Math.random() * 100), c = Math.ceil(p / 10); toast(`${n}: ${r} vs ${p}% → ${r <= c ? "SUCESSO CRÍTICO" : r >= 99 ? "FALHA CRÍTICA" : r <= p ? "Sucesso" : "Falha"}`); };

function loginView(msg = "") {
  app.innerHTML = `<div class="box"><h2>⚔ Mesa Mythras</h2><input id="u" placeholder="Nome de usuário"><input id="p" type="password" placeholder="Senha (mín. 6)">
  <button id="in">Entrar</button><button id="reg" class="g">Criar conta</button><div class="err">${msg}</div></div>`;
  const go = async reg => { const n = $("#u").value, p = $("#p").value, e = slug(n) + DOM; if (!slug(n)) return loginView("Informe um nome.");
    try { if (reg) { const c = await auth.createUserWithEmailAndPassword(e, p);
        await db.doc("cards/" + c.user.uid).set({name: n.trim(), foto: "", pv: 0, pvMax: 0, owner: c.user.uid});
      } else await auth.signInWithEmailAndPassword(e, p);
    } catch (x) { loginView({"auth/email-already-in-use": "Nome já existe.", "auth/invalid-credential": "Nome ou senha incorretos.", "auth/weak-password": "Senha muito curta."}[x.code] || x.message); } };
  $("#in").onclick = () => go(false); $("#reg").onclick = () => go(true);
}
auth.onAuthStateChanged(u => {
  subs.forEach(f => f()); subs = []; npcSub?.(); npcSub = null; me = u; isAdmin = false;
  if (!u) return loginView();
  tab = "fichas"; openId = null;
  subs.push(db.collection("cards").onSnapshot(s => { cache.cards = s.docs.map(d => ({id: d.id, ...d.data()})); if (!openId) render(); }));
  subs.push(db.doc("session/current").onSnapshot(s => { cache.session = s.data() || {}; if (tab === "sessao") render(); }));
  subs.push(db.doc("masters/" + u.uid).onSnapshot(s => { isAdmin = s.exists; npcSub?.(); npcSub = null;
    if (isAdmin) npcSub = db.collection("npcs").onSnapshot(n => { cache.npcs = n.docs.map(d => ({id: d.id, ...d.data()})); if (tab === "npcs") render(); });
    else if (tab === "npcs") tab = "fichas";
    openId = null; shell(); }));
  shell();
});
function shell() {
  app.innerHTML = `<nav><button data-t="fichas">Fichas</button><button data-t="sessao">Sessão</button>${isAdmin ? '<button data-t="npcs">NPCs</button>' : ""}<span class="sp"></span><span class="m">${esc(me.email.split("@")[0])}</span><button id="ms" class="${isAdmin ? "on" : "g"}">👑 ${isAdmin ? "Sair do modo mestre" : "Modo mestre"}</button><button class="g" id="out">Sair</button></nav><main id="main"></main>`;
  document.querySelectorAll("nav [data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; openId = null; render(); });
  $("#out").onclick = () => auth.signOut();
  $("#ms").onclick = async () => { try {
    if (isAdmin) await db.doc("masters/" + me.uid).delete();
    else { const k = prompt("Senha do mestre:"); if (k) await db.doc("masters/" + me.uid).set({k}); }
  } catch (e) { toast("Senha incorreta."); } };
  render();
}
function render() { if (!me || !$("#main")) return;
  document.querySelectorAll("nav [data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  ({fichas: fichasView, sessao: sessaoView, npcs: npcsView})[tab](); }
const cardHTML = (c, click) => `<div class="card ${click ? "click" : ""}" data-id="${c.id}"><div class="ph" style="background-image:url('${c.foto || ""}')"></div><b>${esc(c.name)}</b><div class="bar"><i style="width:${Math.max(0, Math.min(100, 100 * c.pv / (c.pvMax || 1)))}%"></i></div><small class="m">PV ${c.pv}/${c.pvMax}</small></div>`;

/* ---------- FICHAS ---------- */
function fichasView() {
  if (openId) return sheetView(openId);
  $("#main").innerHTML = `<h2>Fichas</h2><p class="m">Você só abre a sua própria ficha.${isAdmin ? " Modo mestre: você abre todas." : ""}</p><div class="grid">${cache.cards.map(c => cardHTML(c, isAdmin || c.id === me.uid)).join("")}</div>`;
  document.querySelectorAll(".card.click").forEach(el => el.onclick = () => { openId = el.dataset.id; render(); });
}
async function sheetView(id) {
  const snap = await db.doc("fichas/" + id).get(), card = cache.cards.find(c => c.id === id) || {name: ""};
  const s = snap.exists ? snap.data() : {};
  s.nome ??= card.name; s.att ??= {}; s.bn ??= {}; s.hp ??= {}; s.cs ??= []; s.es ??= []; s.fad ??= 0; s.ppA ??= null;
  let foto = card.foto || "", sub = "Geral", t;
  const save = () => { $("#st").textContent = "…"; clearTimeout(t); t = setTimeout(async () => {
    const o = calc(s), mx = Object.values(o.hm).reduce((a, b) => a + b, 0), cur = PARTS.reduce((a, [k]) => a + Math.min(s.hp[k] ?? o.hm[k], o.hm[k]), 0);
    await db.doc("fichas/" + id).set(s);
    await db.doc("cards/" + id).set({name: s.nome || card.name, foto, pv: cur, pvMax: mx, owner: id});
    $("#st").textContent = "✔ salvo"; }, 600); };
  const pct = (a, b, x) => (+s.att[a] || 0) + (+s.att[b] || 0) + (+x || 0);
  const tile = (n, a, b, path, inp = true) => `<div class="sk"><b>${n}</b><small>${a} + ${b}</small><div class="pc"><button data-roll="${esc(n)}">🎲</button><span data-p="${path}" data-a="${a}" data-b="${b}"></span></div>${inp ? `<span class="m">bônus</span> <input type="number" data-i="${path}" value="${get(s, path) ?? 0}">` : ""}</div>`;
  const sel = (v, path) => `<select data-i="${path}">${ATTRS.map(a => `<option ${a[0] == v ? "selected" : ""}>${a[0]}</option>`).join("")}</select>`;
  const editor = (k, ph) => `${s[k].map((x, i) => `<div class="ed"><input data-i="${k}.${i}.n" value="${esc(x.n)}" placeholder="${ph}">${sel(x.a, k + "." + i + ".a")}${sel(x.b, k + "." + i + ".b")}<input type="number" data-i="${k}.${i}.x" value="${x.x || 0}"><span><b data-p="${k}.${i}.x" data-a="${x.a}" data-b="${x.b}"></b> <button data-roll="${esc(x.n)}">🎲</button> <button class="g" data-del="${k}.${i}">✕</button></span></div>`).join("")}<button class="g" data-add="${k}">+ Adicionar</button>`;
  const prof = [["genero", "Gênero"], ["idade", "Idade"], ["terra", "Terra natal"], ["cultura", "Cultura"], ["altura", "Altura"], ["peso", "Peso"], ["classe", "Classe social"], ["prof", "Profissão"]];
  const pages = {
    Geral: () => `<div class="pn"><h3>Atributos</h3><div class="row"><select id="pre"><option value="">-- Distribuição --</option>${Object.entries(PRESETS).map(([k, v]) => `<option value="${k}">${k} (${v.join(", ")})</option>`).join("")}</select><span class="m">preenche em ordem; ajuste depois</span></div>
      <div class="attrs">${ATTRS.map(([k, n, c]) => `<div class="at" style="--c:${c}"><b data-o="att.${k}"></b><br><input type="number" data-i="att.${k}" value="${s.att[k] ?? 10}"><small>${n}</small></div>`).join("")}</div></div>
      <div class="pn"><h3>Derivados</h3><div class="der"><div>Pts. de Ação<b data-o="pa"></b></div><div>Mod. de Dano<b data-o="dano"></b></div><div>Mod. de XP<b data-o="xp"></b></div><div>Taxa de Cura<b data-o="cura"></b></div><div>Iniciativa<b data-o="ini"></b></div><div>Pts. de Sorte<b data-o="sorte"></b></div><div>Pts. de Poder<b data-o="pp"></b></div></div></div>`,
    "Perícias": () => `<div class="pn"><h3>Perícias básicas</h3><div class="skg">${BASIC.map(([n, a, b]) => tile(n, a, b, "bn." + n)).join("")}</div></div><div class="pn"><h3>Perícias profissionais / outras</h3>${editor("cs", "Nome da perícia")}</div>`,
    Combate: () => `<div class="pn"><h3>Estilos de combate</h3>${editor("es", "Nome do estilo")}</div>
      <div class="pn"><h3>Localização de acerto</h3><div class="body">${PARTS.map(([k, n]) => k == "cab" ? `<span></span><div class="bp" data-bp="${k}">${n}<br><input type="number" data-i="hp.${k}"> / <span data-o="hm.${k}"></span></div><span></span>` : `<div class="bp" data-bp="${k}">${n}<br><input type="number" data-i="hp.${k}"> / <span data-o="hm.${k}"></span></div>`).join("")}</div>
      <p class="m">Vida por parte do corpo calculada por CON + TAM.</p><button class="g" id="rl">🎲 Rolar local de acerto</button></div>
      <div class="pn"><h3>Resistências</h3><div class="skg">${RESIST.map(n => { const b = BASIC.find(x => x[0] == n); return tile(n, b[1], b[2], "bn." + n, false); }).join("")}</div></div>
      <div class="pn"><h3>Condições e ferimentos</h3><textarea data-i="cond">${esc(s.cond)}</textarea></div>`,
    Notas: () => `<div class="pn"><h3>Poderes / Habilidades</h3><textarea data-i="poderes">${esc(s.poderes)}</textarea></div><div class="pn"><h3>Inventário</h3><textarea data-i="inv">${esc(s.inv)}</textarea></div><div class="pn"><h3>Anotações</h3><textarea data-i="notas">${esc(s.notas)}</textarea></div>`
  };
  const paint = () => { const o = calc(s);
    document.querySelectorAll("[data-p]").forEach(e => e.textContent = pct(e.dataset.a, e.dataset.b, get(s, e.dataset.p)) + "%");
    document.querySelectorAll("[data-o]").forEach(e => { const k = e.dataset.o; e.textContent = k.startsWith("att.") ? s.att[k.slice(4)] ?? 10 : k.startsWith("hm.") ? o.hm[k.slice(3)] : o[k] ?? ""; });
    document.querySelectorAll("[data-bp]").forEach(e => { const k = e.dataset.bp, i = e.querySelector("input"), m = o.hm[k]; if (s.hp[k] == null) i.value = m; const v = +i.value; e.className = "bp " + (v <= 0 ? "d" : v < m ? "w" : ""); });
    const f = $("#fad"); if (f) f.value = s.fad;
  };
  const draw = () => {
    s.att = Object.fromEntries(ATTRS.map(([k]) => [k, s.att[k] ?? 10]));
    const o = calc(s);
    $("#main").innerHTML = `<button class="g" id="bk">← Voltar</button> <span id="st" class="m"></span>
    <div class="top"><div class="ph" id="ph" style="background-image:url('${foto}')" title="Clique para trocar a foto"></div>
    <div class="pn" style="margin:0"><input data-i="nome" value="${esc(s.nome)}" style="font-size:22px;font-weight:700;width:100%;background:none;border:0"><div class="prof">${prof.map(([k, n]) => `<div><label>${n}</label><input data-i="${k}" value="${esc(s[k])}"></div>`).join("")}</div>
    <div class="row"><label class="m">NÍVEL DE FADIGA</label><select id="fad" data-i="fad">${FADIGA.map((f, i) => `<option value="${i}">${f}</option>`).join("")}</select></div></div>
    <div class="side"><div class="st" style="color:#f6a">❤ <span data-o="xp"></span><small>Mod XP</small></div><div class="st" style="color:#b4f"><input type="number" data-i="ppA" value="${s.ppA ?? o.pp}">/<span data-o="pp"></span><small>Pts. Poder</small></div><div class="st" style="color:#6e4"><input type="number" data-i="soA" value="${s.soA ?? o.sorte}">/<span data-o="sorte"></span><small>Sorte</small></div><div class="st" style="color:#4af"><input type="number" data-i="paA" value="${s.paA ?? o.pa}">/<span data-o="pa"></span><small>Pts. Ação</small></div></div></div>
    <input type="file" id="fi" accept="image/*" hidden>
    <div class="sub">${Object.keys(pages).map(p => `<button class="${p == sub ? "on" : ""}" data-s="${p}">${p}</button>`).join("")}</div><div id="pg">${pages[sub]()}</div>`;
    bind(); paint(); };
  const bind = () => {
    $("#bk").onclick = () => { openId = null; render(); };
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sub = b.dataset.s; draw(); });
    $("#ph").onclick = () => $("#fi").click();
    $("#fi").onchange = async e => { foto = await img(e.target.files[0], 400, .7); $("#ph").style.backgroundImage = `url('${foto}')`; save(); };
    document.querySelectorAll("[data-i]").forEach(e => e.oninput = () => { let v = e.type == "number" ? (e.value === "" ? null : +e.value) : e.value; if (e.dataset.i == "fad") v = +v; setp(s, e.dataset.i, v);
      if (e.dataset.i.match(/^(cs|es)\.\d+\.[ab]$/)) { const [k, i] = e.dataset.i.split("."); e.closest(".ed").querySelector("[data-p]").dataset[e.dataset.i.slice(-1)] = v; }
      paint(); save(); });
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { s[b.dataset.add].push({n: "", a: "FOR", b: "DES", x: 0}); draw(); save(); });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const [k, i] = b.dataset.del.split("."); s[k].splice(i, 1); draw(); save(); });
    document.querySelectorAll("[data-roll]").forEach(b => b.onclick = () => d100(b.dataset.roll, parseInt(b.parentElement.querySelector("[data-p]").textContent)));
    const pre = $("#pre"); if (pre) pre.onchange = () => { const v = PRESETS[pre.value]; if (!v) return; ATTRS.forEach(([k], i) => s.att[k] = v[i]); draw(); save(); };
    const rl = $("#rl"); if (rl) rl.onclick = () => { const r = 1 + Math.floor(Math.random() * 20), p = r <= 3 ? "Perna Dir." : r <= 6 ? "Perna Esq." : r <= 9 ? "Abdômen" : r <= 12 ? "Peito" : r <= 15 ? "Braço Dir." : r <= 18 ? "Braço Esq." : "Cabeça"; toast(`d20 = ${r} → ${p}`); };
  };
  draw();
}

/* ---------- SESSÃO ---------- */
function sessaoView() {
  const ss = cache.session, ids = ss.ids || [];
  $("#main").innerHTML = `<h2>Sessão</h2>${isAdmin ? `<div class="pn"><b>Mapa:</b> <input type="file" id="mp" accept="image/*"> <button class="g" id="cm">Remover mapa</button>
  <div class="row">${cache.cards.map(c => `<label><input type="checkbox" data-p="${c.id}" ${ids.includes(c.id) ? "checked" : ""}> ${esc(c.name)}</label>`).join("")}</div></div>` : ""}
  <div class="stage" style="background-image:url('${ss.map || ""}')"><div class="pl">${cache.cards.filter(c => ids.includes(c.id)).map(c => cardHTML(c, false)).join("")}</div></div>`;
  if (!isAdmin) return;
  $("#mp").onchange = async e => db.doc("session/current").set({map: await img(e.target.files[0], 1400, .7)}, {merge: true});
  $("#cm").onclick = () => db.doc("session/current").set({map: ""}, {merge: true});
  document.querySelectorAll("[data-p]").forEach(e => e.onchange = () => db.doc("session/current").set({ids: [...document.querySelectorAll("[data-p]")].filter(x => x.checked).map(x => x.dataset.p)}, {merge: true}));
}

/* ---------- NPCs (modo mestre) ---------- */
function npcsView() {
  $("#main").innerHTML = `<h2>NPCs <span class="m">(privado)</span></h2><button id="nn">+ Novo NPC</button>
  ${cache.npcs.map(n => `<div class="pn" data-n="${n.id}"><div class="row"><input data-f="nome" value="${esc(n.nome)}" placeholder="Nome"> PV <input data-f="pv" type="number" style="width:80px" value="${n.pv ?? 10}"><button class="g" data-d="${n.id}">Excluir</button></div><textarea data-f="notas" placeholder="Atributos, perícias, ataques...">${esc(n.notas)}</textarea></div>`).join("")}`;
  $("#nn").onclick = () => db.collection("npcs").add({nome: "Novo NPC", pv: 10, notas: ""});
  document.querySelectorAll("[data-f]").forEach(e => e.onchange = () => db.doc("npcs/" + e.closest("[data-n]").dataset.n).update({[e.dataset.f]: e.type === "number" ? +e.value : e.value}));
  document.querySelectorAll("[data-d]").forEach(e => e.onclick = () => confirm("Excluir?") && db.doc("npcs/" + e.dataset.d).delete());
}
</script>
